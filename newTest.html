<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Dashboard Layout</title>
</head>
<body class="bg-light">

  <div class="container-fluid py-4">
    <div class="row g-4"> <!-- g-4 = gutter between columns -->

      <!-- Left column: 8/12 on lg+ screens, full width on smaller -->
      <div class="col-lg-8 col-12">

        <!-- Top left block: Ma Progression Globale -->
        <div class="mb-4"> <!-- margin bottom to separate from graph -->
          <div class="progress-analytics-todo h-100">
            <div class="progress-analytics">
              <div class="course-progress">
                <!-- Your "Ma Progression Globale" content goes here -->
                course progress
              </div>
              <div class="course-analytics">
                <!-- Your module progress bars go here -->
                course analytics
              </div>
            </div>
          </div>
        </div>

        <!-- Bottom left block: Activity graph -->
        <div>
          <!-- Your graph goes here -->
          Activité d'Apprentissage (7 derniers jours) + chart
        </div>

      </div>

      <!-- Right column: 4/12 on lg+ screens, full width on smaller -->
      <div class="col-lg-4 col-12">

        <div class="todo h-100">
          <!-- Your "Activités Récentes" list goes here -->
          Todo
        </div>

      </div>

    </div>
  </div>

</body>
</html>
